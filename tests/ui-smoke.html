<!doctype html>
<meta charset="utf-8">
<title>Local RAG UI smoke tests</title>
<pre id="results">Running…</pre>
<iframe id="app" src="../index.html" hidden></iframe>
<script>
const out = document.querySelector('#results');
const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
const check = (condition, message) => { if(!condition) throw new Error(message); };

(async () => {
  try{
    const frame = document.querySelector('#app');
    await new Promise(resolve => {
      if(frame.contentDocument.readyState === 'complete') resolve();
      else frame.addEventListener('load', resolve, {once:true});
    });
    let app = frame.contentWindow;
    app.localStorage.removeItem('localRagSynonymGroups');
    await new Promise(resolve => {
      frame.addEventListener('load', resolve, {once:true});
      app.location.reload();
    });
    app = frame.contentWindow;
    const doc = app.document;

    check(doc.querySelector('#synonymGroups'), 'synonym editor is visible');
    doc.querySelector('#addSynonymGroup').click();
    const synonym = doc.querySelector('#synonymGroups input');
    synonym.value = 'wholesale,退款';
    synonym.dispatchEvent(new app.Event('input', {bubbles:true}));
    check(JSON.parse(app.localStorage.getItem('localRagSynonymGroups'))[0][0] === 'wholesale', 'synonym group persists');

    app.fetch = async (_url, options) => {
      const body = JSON.parse(options.body);
      const answer = body.messages[0].content.includes('rewrite search queries') ? 'unrelated' : 'Test answer';
      return {ok:true, status:200, text:async () => JSON.stringify({choices:[{message:{content:answer}}]})};
    };
    doc.querySelector('#loadDemo').click();
    doc.querySelector('#llmMode').value = 'api';
    doc.querySelector('#apiKey').value = 'test-key';
    doc.querySelector('#debugToggle').checked = true;
    doc.querySelector('#debugToggle').dispatchEvent(new app.Event('change'));
    doc.querySelector('#question').value = 'wholesale';
    doc.querySelector('#askBtn').click();
    await wait(30);
    const debug = doc.querySelector('#debugBox').textContent;
    check(debug.includes('Rewritten Query: unrelated'), 'rewritten query is visible');
    check(debug.includes('Synonym Expansion: 退款'), 'synonym expansion is visible');
    check(debug.includes('All Context fallback: no'), 'BM25 uses matching expanded term without fallback');
    check(doc.querySelector('#chat').textContent.includes('refund.txt'), 'synonym retrieves the refund document');

    doc.querySelector('#minScore').value = '100';
    doc.querySelector('#question').value = 'no-match';
    doc.querySelector('#askBtn').click();
    await wait(30);
    const fallbackDebug = doc.querySelector('#debugBox').textContent;
    check(fallbackDebug.includes('All Context fallback: yes'), 'low score falls back to all context');
    check(fallbackDebug.includes('refund.txt') && fallbackDebug.includes('shipping.txt') && fallbackDebug.includes('account.md'), 'fallback includes every document');

    out.textContent = 'PASS: synonym editor/persistence, rewrite, expansion, BM25, and all-context fallback';
  }catch(error){ out.textContent = `FAIL: ${error.message}`; }
})();
</script>
